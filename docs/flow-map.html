<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD Kit guide has moved</title>
<script>
// Every hash form of the old flow map is still a valid index.html hash.
function map(hash) {
  return hash;
}
var target = 'index.html' + location.search + map(location.hash);
location.replace(target);
document.addEventListener('DOMContentLoaded', function () {
  var link = document.querySelector('a[href^="index.html"]');
  if (link) link.href = target;
});
</script>
</head>
<body>
<p>The guide moved. Open <a href="index.html">index.html</a>.</p>
</body>
</html>
