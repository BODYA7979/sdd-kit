<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD Kit guide has moved</title>
<script>
var SECTIONS = ['primer', 'quickstart', 'pipeline', 'hooks', 'addons', 'links', 'board', 'spec', 'workflows', 'skills', 'agents', 'install', 'after'];
var RENAMED = {
  routes: 'map', hireboard: 'example', anatomy: 'spec', troubleshoot: 'help',
  commands: 'everyday', browser: 'hooks', doctor: 'hooks'
};
// The terminal's own command aliases, so links typed with them still resolve.
var ALIASES = {
  everyday: 'commands', more: 'commands', troubleshooting: 'troubleshoot', faq: 'troubleshoot',
  skill: 'skills', agent: 'agents', hook: 'hooks', 'add-ons': 'addons', start: 'quickstart',
  route: 'routes', newbie: 'primer', glossary: 'primer', 'after-sdd': 'after', example: 'hireboard',
  chapters: 'hireboard', specs: 'board', kanban: 'board', 'spec-board': 'board', playwright: 'browser'
};
var INSTALL_MODES = { plugin: 'plugin', copy: 'file-copy', file: 'file-copy', filecopy: 'file-copy', flags: 'file-copy', npx: 'npx' };

function own(table, key) {
  return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : undefined;
}

// Old terminal links carried a command line in the hash ('#<command> <argument>'):
// resolve it the way the terminal did, then map it to an index.html hash.
function map(hash) {
  if (!hash) return '';
  var text;
  try { text = decodeURIComponent(hash.slice(1).replace(/\+/g, ' ')); } catch (e) { return ''; }
  var parts = text.trim().split(/\s+/);
  var command = parts[0].toLowerCase().replace(/^\//, '');
  if (command.indexOf('sdd-kit:') === 0) command = command.slice(8);
  var arg = parts.slice(1).join(' ');
  if (arg && (command === 'example' || command === 'chapters')) command = 'chapter';
  if (arg && command === 'spec') command = 'board';
  command = own(ALIASES, command) || command;
  if (command === 'sdd') return arg ? '#route/' + arg.toLowerCase() : '#map';
  if (command === 'chapter') {
    var n = arg.toLowerCase();
    if (/^\d$/.test(n)) n = '0' + n;
    return /^\d\d$/.test(n) ? '#example/' + n : '#example';
  }
  if (command === 'workflow') return arg ? '#workflow/' + arg : '#workflows';
  if (command === 'skills' || command === 'agents') return '#' + command + (arg ? '?q=' + encodeURIComponent(arg) : '');
  if (command === 'troubleshoot') return '#help' + (arg ? '?q=' + encodeURIComponent(arg) : '');
  if (command === 'install') {
    var mode = own(INSTALL_MODES, arg.toLowerCase());
    return '#install' + (mode ? '/' + mode : '');
  }
  if (command === 'board' || command === 'after') return '#' + command + (arg ? '/' + arg : '');
  if (own(RENAMED, command)) return '#' + RENAMED[command];
  return SECTIONS.indexOf(command) >= 0 ? '#' + command : '';
}
var target = 'index.html' + location.search + map(location.hash);
location.replace(target);
document.addEventListener('DOMContentLoaded', function () {
  var link = document.querySelector('a[href^="index.html"]');
  if (link) link.href = target;
});
</script>
</head>
<body>
<p>The guide moved. Open <a href="index.html">index.html</a>.</p>
</body>
</html>
