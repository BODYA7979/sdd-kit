schema_version: "1.0"
name: hireboard-routing
description: /sdd classifies six Hireboard requests into all six routes (bug, feature, decision, shipped, new app, trivial) without launching anything.
tags: [routing, sdd, project]
runs: 5
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
expected_outcome: "1 = bug, 2 = feature, 3 = decision, 4 = shipped, 5 = new app, 6 = trivial."
