an account and a dashboard. Guests keep browsing jobs\n  without signing in.\n\n## Scope\n### In scope\n- `role` column on `users` (schema doc first), `UserRole` enum, role helpers on `User`, factory states.\n- `POST /api/v1/auth/register`, `POST /api/v1/auth/login`, `POST /api/v1/auth/logout`, `GET /api/v1/auth/me`.\n- Employer registration creates the employer's company (BR-02).\n- Demo accounts in `DemoUserSeeder` (candidate, employer owning Acme Robotics, admin).\n- Web: `/login`, `/register`, `/dashboard`, the `(account)` layout with role-based navigation and\n  sign-out, `middleware.ts`, `lib/session.ts`.\n### Out of scope\n- Email verification, password reset, \"remember me\", social login.\n- Admin user management (admins are seeded only, BR-01).\n- Refresh or sliding token expiry (deferred in ADR-0001).\n- Editing the company created at registration (HIRE-11 area).\n\n## Must NOT change\n- **MNC-1**: `GET /api/v1/jobs`, `GET /api/v1/jobs/{id}` and `GET /api/v1/companies/{slug}` stay public\n  (no token needed) with unchanged response shapes.\n- **MNC-2**: `/jobs` renders for guests without a redirect to `/login`.\n\n## Acceptance criteria\n- **AC-1**: WHEN a visitor registers with role `candidate`, a name, a valid unused email and a confirmed\n  password of 8+ chars THE SYSTEM SHALL create the user and respond 201 with `{user, token}` where\n  `user.role` is `candidate`.\n- **AC-2**: WHEN a visitor registers with role `employer` and a `company_name` of 2-120 chars THE SYSTEM\n  SHALL create the user and one company owned by them, with slug `Str::slug(company_name)` and `-2`,\n  `-3` ... appended while the slug is taken (BR-02). IF `company_name` is missing THEN THE SYSTEM SHALL\n  respond 422.\n- **AC-3**: IF the requested role is `admin` (or anything other than `candidate`/`employer`) THEN THE\n  SYSTEM SHALL respond 422 `validation_failed` with an error on `role` and create nothing (BR-01).\n- **AC-4**: IF the email is already registered, compared case-insensitively, THEN THE SYSTEM SHALL\n  respond 422 `validation_failed` with an error on `email` (BR-03).\n- **AC-5**: WHEN a user logs in with a valid email (any case) and password THE SYSTEM SHALL respond 200\n  with `{user, token}`; the token is named `web` and expires after 7 days (BR-04).\n- **AC-6**: IF the email is unknown or the password is wrong THEN THE SYSTEM SHALL respond 422 with code\n  `invalid_credentials` and the same message in both cases.\n- **AC-7**: WHEN a signed-in user logs out THE SYSTEM SHALL revoke the token used for that request,\n  respond 204, and a later `GET /api/v1/auth/me` with that token SHALL respond 401. Other tokens of the\n  same user stay valid.\n- **AC-8**: WHEN a signed-in user requests `GET /api/v1/auth/me` THE SYSTEM SHALL respond 200 with exactly\n  `{id, name, email, role}`.\n- **AC-9**: IF more than 6 requests to `POST /api/v1/auth/login` and `POST /api/v1/auth/register`\n  combined arrive from one client within a minute THEN THE SYSTEM SHALL respond 429\n  `too_many_requests`. Both routes deliberately share one `throttle:6,1` bucket per client, so the\n  limit is verified on login.\n- **AC-10**: WHEN a user signs in on `/login` THE web app SHALL set the HttpOnly `hireboard_session`\n  cookie (SameSite=Lax, 7 days) and redirect to `/dashboard` (or the `next` path); the token SHALL NOT\n  be readable from browser JavaScript.\n- **AC-11**: WHEN a guest opens `/dashboard` THE web app SHALL redirect to `/login?next=/dashboard`.\n\n## Boundaries\n- **Always**: a Pest feature test per API AC; service-repository + DTOs (INV-02); schema doc before the\n  migration; add the auth routes to `api/docs/api/api-contracts.md` and `web/lib/api/endpoints.ts` (INV-06);\n  every web call through `lib/api/client.ts`.\n- **Ask first**: any change to existing `users` columns beyond adding `role`; a new dependency (Sanctum is\n  already installed by `install:api`); changing a public endpoint; touching `config/sanctum.php`.\n- **Never**: return the token to browser JavaScript or store it in `localStorage` (INV-05); expose\n  `NEXT_PUBLIC_` API URLs; allow admin self-registration; weaken an existing test.\n\n## Technical context\n- **Related code**: `app/Http/Controllers/Jobs/*` and `app/Services/JobPostingService.php` (controller →\n  service → repository shape from HIRE-1), `app/Repositories/CompanyRepository.php` (gains\n  `createForOwner` with BR-02 slug suffixing), `bootstrap/app.php` (error envelope incl. 401/429),\n  `web/lib/api/client.ts` (`token` option), `docs/adr/0001-spa-auth.md`.\n- **Already implemented**: Sanctum (installed by `php artisan install:api`, `personal_access_tokens`\n  migration present); `CompanyRepository::findBySlug`; the 401 and 429 envelopes in `bootstrap/app.php`;\n  the `token` option of `apiFetch`. **Missing**: `HasApiTokens` and a role on `User`, the auth routes,\n  `CompanyRepositoryInterface::createForOwner`, the auth entries in `web/lib/api/endpoints.ts`, any web\n  session code.\n- **Approach**: `RegisterController` / `LoginController` / `LogoutController` / `ShowCurrentUserController`\n  → `AuthService` → `UserRepositoryInterface` (`create`, `verifyCredentials`, `issueToken`, `revokeToken`)\n  and `CompanyRepositoryInterface::createForOwner`. Web: `loginAction` / `registerAction` call the API,\n  store the token with `setSessionToken`, and redirect. `middleware.ts` checks cookie presence;\n  `requireUser()` checks the token and the role on the server.\n- **Repos**: backend `api/`, frontend `web/` (workspace `~/work/hireboard`).\n\n## Decisions\n1. Token lifetime is set per token at creation (`createToken('web', ['*'], now()-\u003eaddDays(7))`) rather\n   than in `config/sanctum.php`, so the rule lives next to the code that issues tokens (ADR-0001).\n2. Logout revokes the token found from the request's bearer value, which keeps Eloquent models out of\n   `AuthService`.\n3. Invalid credentials are a 422 with a dedicated code, not a 401, so the login form can tell \"wrong\n   password\" apart from \"session expired\".\n\n## Open questions\n- [x] Q1: Is email verification required before a user can sign in or apply? — **Accepted assumption**:\n  out of scope for v1. `email_verified_at` stays unused.\n- [x] Q2: What is the password rule? — **Answered (Maya Chen)**: minimum 8 characters, confirmed. No\n  complexity rules in v1. Folded into AC-1.\n- [x] Q3: How long does a session last, and does logout end all sessions? — **Answered**: 7 days per\n  ADR-0001 and BR-04; logout revokes only the current token. Folded into AC-5 and AC-7.\n- [x] Q4: Which employer owns the seeded Acme Robotics company? — **Answered**: `employer@acme.test`\n  (\"Erin Employer\"), attached by `DemoUserSeeder`.\n\n## Dependencies\n- **Requires**: ADR-0001 (accepted), HIRE-1 (companies table and `CompanyRepository`).\n- **Blocks**: spec-HIRE-4-company-reviews, spec-HIRE-5-candidate-profiles, spec-HIRE-6-job-applications.\n\n---\nNext: `/sdd spec-HIRE-3-accounts-and-roles` (approval → build) or `/execute-task --spec=HIRE-3`\n","tasks":{"present":true,"counting":"numbered","total":6,"done":6,"subtotal":26,"subdone":26,"phases":["Phase 1: Backend (api/)","Phase 2: Frontend (web/)","Phase: Gaps (converge round 1)"],"items":[{"number":1,"title":"Schema doc, role migration, UserRole, User and UserFactory","stack":"laravel","checked":true,"phase":"Phase 1: Backend (api/)","covers":[],"coversText":"scaffolding for AC-1..AC-8","subtasks":[{"number":"1.1","text":"Update `docs/schemas/users.md` first (schema-first): `role` string(20), default `candidate`, indexed","checked":true,"verify":false},{"number":"1.2","text":"Migration `2026_10_21_090000_add_role_to_users_table` (additive, default, `down()` drops the index first)","checked":true,"verify":false},{"number":"1.3","text":"`App\\Enums\\UserRole`; `User` gets `HasApiTokens`, the `role` cast and `isCandidate()` / `isEmployer()` / `isAdmin()`","checked":true,"verify":false},{"number":"1.4","text":"`UserFactory` states `  out of scope for v1. `email_verified_at` stays unused.","checked":true},{"text":"Q2: What is the password rule? — **Answered (Maya Chen)**: minimum 8 characters, confirmed. No complexity rules in v1. Folded into AC-1.","checked":true},{"text":"Q3: How long does a session last, and does logout end all sessions? — **Answered**: 7 days per ADR-0001 and BR-04; logout revokes only the current token. Folded into AC-5 and AC-7.","checked":true},{"text":"Q4: Which employer owns the seeded Acme Robotics company? — **Answered**: `employer@acme.test` (\"Erin Employer\"), attached by `DemoUserSeeder`.","checked":true}],"openQuestionCount":0,"uncovered":[],"warnings":[],"errors":[],"session":null,"files":[{"path":"spec-lite.md","bytes":7897,"kind":"markdown","view":"spec","content":null,"note":null},{"path":"tasks.md","bytes":6126,"kind":"markdown","view":null,"content":"# Accounts and roles — Tasks\n\n**Spec**: spec-HIRE-3-accounts-and-roles | **Size**: M | **Tasks**: 6 (5 planned + 1 converge gap)\n\n## Phase 1: Backend (api/)\n\n- [x] 1. Schema doc, role migration, UserRole, User and UserFactory (laravel)\n  - Covers: scaffolding for AC-1..AC-8\n  - [x] 1.1 Update `docs/schemas/users.md` first (schema-first): `role` string(20), default `candidate`, indexed\n  - [x] 1.2 Migration `2026_10_21_090000_add_role_to_users_table` (additive, default, `down()` drops the index first)\n  - [x] 1.3 `App\\Enums\\UserRole`; `User` gets `HasApiTokens`, the `role` cast and `isCandidate()` / `isEmployer()` / `isAdmin()`\n  - [x] 1.4 `UserFactory` states `candidate()`, `employer()`, `admin()`\n  - [x] 1.5 **Verify**: `php artisan migrate:fresh` locally; existing tests green; gates green\n\n- [x] 2. Auth endpoints, AuthService, DTOs and tests (laravel)\n  - Covers: AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7, AC-8, MNC-1\n  - [x] 2.1 Failing Pest tests in `tests/Feature/Auth/` (`RegisterTest`, `LoginTest`, `LogoutTest`), one per AC\n  - [x] 2.2 Guard test `PublicEndpointsGuardTest`: job search, job detail and company profile without a token, shapes unchanged\n  - [x] 2.3 DTOs `RegisterUserDTO` (`required_if:role,employer` for `company_name`, email lowercased before `unique`), `LoginDTO`, `UserDTO`, `AuthResultDTO`\n  - [x] 2.4 `UserRepositoryInterface` + `UserRepository` (`create`, `verifyCredentials`, `issueToken`, `revokeToken`), bound in `RepositoryServiceProvider`\n  - [x] 2.5 `CompanyRepositoryInterface::createForOwner` with BR-02 slug suffixing\n  - [x] 2.6 `AuthService` (register in one transaction), `InvalidCredentialsException`\n  - [x] 2.7 Four invokable controllers + `routes/api/v1/auth.php`; auth section in `docs/api/api-contracts.md`\n  - [x] 2.8 **Verify**: new tests green; `SearchJobPostingsTest`, `ShowJobPostingTest`, `ShowCompanyTest` unchanged and green; gates green\n\n- [x] 3. Demo accounts in DemoUserSeeder (laravel)\n  - Covers: scaffolding (preconditions of manual-test.md)\n  - [x] 3.1 `DemoUserSeeder`: candidate@hireboard.test, employer@acme.test (owns `acme-robotics`), admin@hireboard.test, password `password`\n  - [x] 3.2 `DatabaseSeeder` calls `JobBoardSeeder` then `DemoUserSeeder`\n  - [x] 3.3 **Verify**: `php artisan migrate:fresh --seed`; `curl -X POST localhost:8000/api/v1/auth/login` with each account returns 200\n\n## Phase 2: Frontend (web/)\n\n- [x] 4. Session helpers and auth fetchers (nextjs)\n  - Covers: AC-10 (data layer)\n  - [x] 4.1 `types/api/auth.ts` mirrors `UserDTO` / `AuthResultDTO` (`UserRole` literals match the enum)\n  - [x] 4.2 `register`, `login`, `logout`, `me` in `lib/api/endpoints.ts`; `lib/api/auth.ts`\n  - [x] 4.3 `lib/session.ts`: `SESSION_COOKIE`, cookie flags (HttpOnly, SameSite=Lax, Secure in production, 7 days), `getCurrentUser()` (null on 401), `requireUser(roles?)`\n  - [x] 4.4 **Verify**: web gates green\n\n- [x] 5. Login and register pages, middleware, account layout and dashboard (nextjs)\n  - Covers: AC-10, AC-11, MNC-2\n  - [x] 5.1 `app/(auth)/actions.ts` `loginAction` / `registerAction`: API t | 2 |\n| AC-8 | /me returns {id, name, email, role} | `tests/Feature/Auth/LoginTest.php::returns the current user` | test | 2 |\n| AC-9 | login throttled to 6/min | `tests/Feature/Auth/LoginTest.php::throttles repeated login attempts` | test | 6 |\n| AC-10 | HttpOnly cookie, redirect to /dashboard | `manual-test.md#step-2` | manual | 4, 5 |\n| AC-11 | guest /dashboard → /login?next=/dashboard | `manual-test.md#step-4` | manual | 5 |\n| MNC-1 | public endpoints tokenless, shapes unchanged | `tests/Feature/Auth/PublicEndpointsGuardTest.php::keeps job search, job detail and company profile public` | test | 2 |\n| MNC-2 | /jobs renders for guests | `manual-test.md#step-5` | manual | 5 |\n\n## Verification gates\n\n- backend (api/): `./vendor/bin/pint --test`, `./vendor/bin/phpstan analyse --no-progress`, `php artisan test`\n- frontend (web/): `npm run lint`, `npx tsc --noEmit`, `npm test`, plus `npm run build` for task 5 (new routes)\n\n## Done when\n- [x] All tasks checked\n- [x] Every Traceability row has a passing test or a manual step that was run\n- [x] Gates green\n","note":null},{"path":"manual-test.md","bytes":4931,"kind":"markdown","view":null,"content":"# Accounts and roles — manual test\n\n**Spec**: spec-HIRE-3-accounts-and-roles | **Ticket**: HIRE-3\n\n## Preconditions\n\n1. API running with fresh demo data (local only, this wipes the database):\n\n   ```bash\n   cd ~/work/hireboard/api\n   php artisan migrate:fresh --seed\n   php artisan serve --port=8000\n   ```\n\n2. Web running in a second terminal, with `API_BASE_URL=http://localhost:8000` in `web/.env.local`:\n\n   ```bash\n   cd ~/work/hireboard/web\n   npm run dev\n   ```\n\n3. Use a private browser window so no old `hireboard_session` cookie is present.\n\nDemo accounts (password `password`): `candidate@hireboard.test`, `employer@acme.test`,\n`admin@hireboard.test`. Register and login share a limit of 6 requests per minute per client; wait a\nminute if a step answers \"Too many attempts\".\n\n### Step 1\n\nA new candidate registers and lands on the dashboard (AC-1 through the UI).\n\n1. Open http://localhost:3000/register.\n2. Leave \"Looking for a job\" selected. Enter name `Dana Candidate`, email `Dana@Example.test`,\n   password `secret-pass` twice. Click **Create account**.\n\n**Expected**: the browser ends on http://localhost:3000/dashboard with the heading \"Welcome, Dana\nCandidate\" and \"Signed in as dana@example.test\" (lowercased). The account nav shows Dashboard,\nProfile, Applications, \"Dana Candidate · candidate\" and **Sign out**.\n\n### Step 2\n\nThe session cookie is HttpOnly and the token never reaches browser JavaScript (AC-10).\n\n1. Still signed in from step 1, open DevTools → Application → Cookies → `http://localhost:3000`.\n2. In the Console, run `document.cookie`.\n3. In the Network tab, reload `/dashboard` and filter by `8000`.\n\n**Expected**:\n- A `hireboard_session` cookie exists with **HttpOnly** ticked, **SameSite** `Lax`, Path `/`, and an\n  expiry 7 days from now. **Secure** is not ticked on `localhost` (it is set in production builds).\n- `document.cookie` does not contain `hireboard_session`.\n- No request from the browser goes to `localhost:8000`. The Next.js server calls the API.\n\n### Step 3\n\nAn employer registers together with a company; a taken slug gets a suffix (AC-2 end to end).\n\n1. Click **Sign out**. Open http://localhost:3000/register.\n2. Select \"Hiring for my company\". A **Company name** field appears. Enter name `Erin Two`, email\n   `erin2@example.test`, company name `Acme Robotics`, password `secret-pass` twice. Submit.\n3. Run:\n\n   ```bash\n   curl -s localhost:8000/api/v1/companies/acme-robotics-2 | jq '.data | {slug, name}'\n   ```\n\n**Expected**: the dashboard shows the employer nav (Dashboard, Applications). The `curl` prints\n`{\"slug\": \"acme-robotics-2\", \"name\": \"Acme Robotics\"}` because the seeded Acme Robotics already owns\n`acme-robotics`. Submitting the employer form with an empty company name instead shows an error under\n**Company name** and creates nothing.\n\n### Step 4\n\nGuests are sent to the login page with a return path (AC-11).\n\n```bash\ncurl -s -o /dev/null -w '%{http_code} %{redirect_url}\\n' http://localhost:3000/dashboard\n```\n\nThen, in the private window after signing out, open http://localhost:3000/dashboard.\n\n**Expected**: `307 http://localhost:3000/login?next=%2Fdashboard`. In the browser the address bar shows\n`/login?next=%2Fdashboard`. Signing in there as `candidate@hireboard.test` / `password` lands on\n`/dashboard`.\n\n### Step 5\n\nPublic job browsing is unchanged for guests (MNC-2).\n\n1. Sign out. Open http://localhost:3000/jobs.\n2. Click any job title.\n\n**Expected**: the job list and the job detail page render without a redirect to `/login`, with the\nsame 8 open jobs as before HIRE-3. The header still shows **Sign in** and **Dashboard** links.\n\n### Step 6\n\nSign-out revokes the token (AC-7 end to end).\n\n1. Sign in as `employer@acme.test` / `password`.\n2. In DevTools → Application → Cookies, copy the `hireboard_session` value.\n3. Click **Sign out**, then run (replace `\u003ctoken\u003e`):\n\n   ```bash\n   curl -s -H 'Accept: application/json' -H 'Authorization: Bearer \u003ctoken\u003e' localhost:8000/api/v1/auth/me | jq '{status, code}'\n   ```\n\n**Expected**: after **Sign out** the browser is on `/login` and the cookie is gone. The `curl` prints\n`{\"status\": 401, \"code\": \"unauthenticated\"}`.\n\n### Step 7\n\nWrong credentials and throttling show readable messages (AC-6, AC-9 in the UI).\n\n1. On http://localhost:3000/login enter `candidate@hireboard.test` with password `wrong-pass`. Submit.\n2. Submit the same wrong password six more times within a minute.\n\n**Expected**: the first attempts show \"Email or password is incorrect.\" above the form. Once the\nlimit is hit the form shows \"Too many attempts. Wait a minute and try again.\" After a minute the\ncorrect password works again.\n\n## Rollback\n\nThe change is additive: one new column with a default, new routes and new pages. To roll\nback, revert both PRs (web first, then api) and run `php artisan migrate:rollback --step=1` on the\nAPI to drop `users.role`. Existing job endpoints do not depend on it.\n","note":null}],"updatedAt":"2026-10-21T08:55:00.000Z","updatedSource":"approved","etag":"285e122c3cf5"},{"key":"api/spec-HIRE-4-company-reviews","id":"spec-HIRE-4-company-reviews","folder":"spec-HIRE-4-company-reviews","root":"r0","repo":"api","format":"frontmatter","folderPattern":"ticket","shortId":"HIRE-4","title":"Company reviews with moderation","type":"feature","size":"M","priority":"P2","status":"done","statusSource":"frontmatter","rawStatus":"done","ticket":"HIRE-4","stakeholders":["Maya Chen"],"approvedBy":"Maya Chen","approvedAt":"2026-10-22T09:40:00Z","created":"2026-10-22","stacks":["laravel","nextjs"],"frontmatter":{"id":"spec-HIRE-4-company-reviews","title":"Company reviews with moderation","type":"feature","size":"M","priority":"P2","status":"done","ticket":"HIRE-4","stakeholders":["Maya Chen"],"approved_by":"Maya Chen","approved_at":"2026-10-22T09:40:00Z","created":"2026-10-22","stacks":["laravel","nextjs"]},"body":"# Company reviews with moderation\n\n## Summary\nCandidates rate and review companies, and an admin moderates every review before anyone else\nsees it. Job seekers get employer ratings they can trust: one review per candidate per company,\nno anonymous drive-by posts, and nothing public until a human has read it. The work adds one\ntable, six API endpoints, a public reviews page and an admin moderation queue.\n\n## Context\n- **Problem**: HIRE-4 (\"Candidates can rate and review companies; reviews are moderated; one\n  review per candidate per company\"). Hireboard shows companies but gives job seekers no signal\n  about what working there is like. The rules were agreed with Maya Chen at the start\n  (BR-40..BR-43 in `docs/context/business-rules.md`) and have not been implemented yet.\n- **User impact**: visitors see an average rating and approved reviews per company. Candidates\n  can share their experience without exposing their identity. Admins keep abusive or identifying\n  content off the site.\n\n## Scope\n### In scope\n- `company_reviews` table, `ReviewStatus` enum, `CompanyReview` model and factory (schema doc first).\n- API: submit a review, read your own review, public list with average rating, admin queue\n  (pending reviews only, oldest first, paginated, each with `candidate_name` and the company name\n  and slug; non-admins get 403, see AC-10), approve, reject.\n- Web: `/companies/[slug]/reviews` (public list, `ReviewForm` for candidates, status card when\n  the candidate already has a review) and `/admin/reviews` (moderation queue).\n- Contract docs: `docs/api/api-contracts.md` and `web/lib/api/endpoints.ts`.\n### Out of scope\n- Editing, deleting or resubmitting a review after submission or after a decision (BR-44).\n- Employer replies to reviews.\n- Moderation by employers, or any employer view of reviews beyond the public list.\n- Requiring an application to the company before reviewing (clarity gate Q2).\n- Rating fields on `GET /api/v1/companies/{slug}` (see MNC-1 and decisions.md D1).\n- Notifications to the candidate when a review is decided.\n\n## Must NOT change\n- **MNC-1**: The `GET /api/v1/companies/{slug}` response shape is unchanged (no review fields are added).\n- **MNC-2**: `GET /api/v1/jobs` and the `/jobs` page are unchanged.\n- **MNC-3**: The `GET /api/v1/auth/me` shape and role semantics are unchanged.\n\n## Acceptance criteria\n- **AC-1**: WHEN an authenticated candidate submits a review (rating 1-5, title 5-120 chars,\n  body 20-2000 chars) for an existing company THE SYSTEM SHALL store it with status pending and\n  respond 201 with status \"pending\".\n- **AC-2**: IF the candidate already has a review for that company in any status THEN THE SYSTEM\n  SHALL respond 409 with code review_already_exists.\n- **AC-3**: IF the authenticated user is an employer or admin THEN THE SYSTEM SHALL respond 403\n  to a review submission.\n- **AC-4**: IF rating, title or body is invalid THEN THE SYSTEM SHALL respond 422 with field errors.\n- **AC-5**: WHEN a guest submits a review THE SYSTEM SHALL respond 401.\n- **AC-6**: WHEN anyone requests a company's reviews THE SYSTEM SHALL return only approved\n  reviews, newest first, paginated, with author \"Verified candidate\" and no candidate id or name.\n- **AC-7**: THE SYSTEM SHALL return meta.average_rating as the mean of approved ratings rounded\n  half-up to 1 decimal, or null when there are none.\n- **AC-8**: WHEN an admin approves a pending review THE SYSTEM SHALL set status approved,\n  moderated_by and moderated_at, and the review SHALL appear in the public list.\n- **AC-9**: WHEN an admin rejects a pending review with a 5-255 char reason THE SYSTEM SHALL set\n  status rejected and store the reason. The review SHALL never appear publicly, and the candidate\n  SHALL see status and reason via /reviews/mine.\n- **AC-10**: IF the review is not pending THEN approve and reject SHALL respond 409\n  review_already_moderated. IF the user is not an admin THEN they SHALL respond 403.\n- **AC-11**: WHEN a signed-in candidate without a review opens /companies/{slug}/reviews THE page\n  SHALL show ReviewForm, and after submitting it SHALL show \"Thanks - your review is awaiting\n  moderation.\" With an existing review, the page SHALL show its status instead of the form\n  (manual-test.md#step-3, #step-4).\n\n## Boundaries\n- **Always**: a Pest feature test per AC; service-repository with DTOs (INV-02); update\n  `docs/api/api-contracts.md` and `web/lib/api/endpoints.ts` (INV-06); responses in the INV-01\n  envelope; error codes from the contract list.\n- **Ask first**: any change to the `companies` or `users` tables; a new dependency; any change to\n  the company show payload.\n- **Never**: expose candidate identity publicly; weaken or delete existing tests; touch auth flows\n  (registration, login, tokens, middleware).\n\n## Technical context\n- **Related code**:\n  - `app/Contracts/CompanyRepositoryInterface.php` — `findBySlug()` resolves the company (returns null when unknown).\n  - `app/Services/CompanyService.php`, `app/DTOs/CompanyDTO.php` — the company show payload MNC-1 protects.\n  - `app/Models/User.php` — `isCandidate()`, `isAdmin()`; `app/Enums/UserRole.php`.\n  - `app/Policies/` — empty so far; policies are auto-discovered by model name and called with\n    `$this-\u003eauthorize()` from invokable controllers (base `Controller` uses `AuthorizesRequests`).\n  - `bootstrap/app.php` — renders `BusinessRuleException` subclasses, validation, 401 and 403\n    in the INV-01 error envelope.\n  - `routes/api.php` — loads every `routes/api/v1/*.php`; this spec adds `reviews.php`.\n  - web: `lib/api/client.ts` (`apiFetch`, `ApiError`), `lib/session.ts` (`getCurrentUser`,\n    `requireUser`, `getSessionToken`), `app/(account)/layout.tsx` (role nav already links\n    admins to `/admin/reviews`), `middleware.ts` (matcher already covers `/admin/:path*`).\n- **Already implemented** (do not rebuild):\n  - Company lookup by slug and the `company_not_found` error (HIRE-1).\n  - Roles, Sanctum tokens and the seeded admin `admin@hireboard.test` (HIRE-3).\n  - The account layout already shows admins a \"Review queue\" link to `/admin/reviews`, and the\n    middleware matcher already covers `/admin/:path*` (HIRE-3). The link 404s today.\n  - Nothing review-related exists yet: no table, model, routes or registry entries\n    (`git log --oneline -20` and `git grep -i review` in both repos).\n- **Approach**: schema doc → migration → enum/model/factory, then `CompanyReviewService`\n  (submit, listApproved, averageRating, findMine, listPending, approve, reject) over\n  `CompanyReviewRepositoryInterface`. One output DTO with three serializers (public, owner,\n  moderation) so identity can only leak through a deliberate method choice. Policy\n  `CompanyReviewPolicy` (create: candidate, moderate: admin). Web pages are Server Components;\n  the form uses a Server Action with `useActionState` and maps API error codes to messages.\n- **Repos**: `api/` (Laravel 12) then `web/` (Next.js 15). Workspace root `~/work/hireboard`.\n\n## Decisions\nSee [decisions.md](decisions.md): D1 rating summary in list meta, D2 status column, D3 unique\nindex plus pre-check.\n\n## Open questions\n- [x] Q1: Can a candidate edit or resubmit a review after it is rejected? — **Accepted\n  assumption**: no. Moderation is final in v1, and the one-review rule (AC-2) applies whatever the\n  status. Recorded as BR-44 in `docs/context/business-rules.md`.\n- [x] Q2: Must the candidate have applied to the company before reviewing it? — **Answered**\n  (Maya Chen): no, not for v1. Any candidate may review any company. Added to Out of scope.\n- [x] Q3: What does \"anonymous\" mean for the public list and for admins? — **Answered** (Maya\n  Chen): the public author is always \"Verified candidate\", with no candidate id or name. Admins\n  see `candidate_name` in the queue. Folded into AC-6.\n- [x] Q4: How is the average rounded, and what is shown with no reviews? — **Answered** (Maya\n  Chen): one decimal, half-up, and null when there are no approved reviews. Folded into AC-7.\n- [x] Q5: Do pending or rejected reviews count toward the average or the total? — **Answered**\n  (Maya Chen): no, approved only. Folded into AC-6 and AC-7.\n- [x] Q6: Who creates admin accounts? — **Accepted assumption**: admins are seeded only\n  (`DemoUserSeeder`), never self-registered (BR-01). No admin management UI in this spec.\n\n## Dependencies\n- **Requires**: spec-HIRE-3-accounts-and-roles (roles, Sanctum tokens, session cookie, account\n  layout, `requireUser`).\n- **Blocks**: HIRE-7 careers page (reads `meta.average_rating` and `meta.total`).\n\n---\nNext: `/sdd spec-HIRE-4-company-reviews` (approval → build) or `/execut us → 409 review_already_exists | `tests/Feature/Reviews/SubmitCompanyReviewTest.php::rejects a second review from the same candidate` | test | 2, 6 |\n| AC-3 | employer or admin submit → 403 | `tests/Feature/Reviews/SubmitCompanyReviewTest.php::forbids employers and admins from reviewing` | test | 2, 6 |\n| AC-4 | invalid rating/title/body → 422 field errors | `tests/Feature/Reviews/SubmitCompanyReviewTest.php::validates rating, title and body` | test | 2, 6 |\n| AC-5 | guest submit → 401 | `tests/Feature/Reviews/SubmitCompanyReviewTest.php::requires authentication` | test | 2 |\n| AC-6 | approved only, newest first, anonymous author | `tests/Feature/Reviews/ListCompanyReviewsTest.php::lists only approved reviews newest first without author identity` | test | 3, 5 |\n| AC-7 | average of approved, half-up 1 decimal, null when none | `tests/Feature/Reviews/ListCompanyReviewsTest.php::reports the average of approved ratings only` | test | 3, 5 |\n| AC-8 | approve sets status, moderator, time; review becomes public | `tests/Feature/Reviews/ModerateReviewTest.php::approves a pending review`, `manual-test.md#step-6` (human, after TestPlan) | test + manual | 4, 7 |\n| AC-9 | reject stores reason; never public; candidate sees it via mine | `tests/Feature/Reviews/ModerateReviewTest.php::rejects a pending review with a reason`, `tests/Feature/Reviews/SubmitCompanyReviewTest.php::shows the candidate their own review status`, `manual-test.md#step-7` (human, after TestPlan) | test + manual | 2, 4, 7 |\n| AC-10 | not pending → 409; non-admin → 403 | `tests/Feature/Reviews/ModerateReviewTest.php::refuses to moderate a review twice`, `tests/Feature/Reviews/ModerateReviewTest.php::forbids non-admins from moderating` | test | 4 |\n| AC-11 | form for candidates without a review, confirmation, status card | `manual-test.md#step-3`, `manual-test.md#step-4` (run by a human after TestPlan) | manual | 6 |\n| MNC-1 | company show payload unchanged | `tests/Feature/Reviews/ListCompanyReviewsTest.php::leaves the company profile response unchanged`, `manual-test.md#step-8` | test + manual | 3 |\n| MNC-2 | job search API and /jobs unchanged | `tests/Feature/Jobs/SearchJobPostingsTest.php` (unchanged, green), `manual-test.md#step-9` | test + manual | — |\n| MNC-3 | /auth/me shape and roles unchanged | `tests/Feature/Auth/LoginTest.php::returns the current user` (unchanged, green) | test | — |\n\n## Verification gates\n\nRun after every task in the repo the task touches.\n- backend (`api/`, laravel): `./vendor/bin/pint --test`, `./vendor/bin/phpstan analyse --no-progress`, `php artisan test`\n- frontend (`web/`, nextjs): `npm run lint`, `npx tsc --noEmit`, `npm test`, plus `npm run build` (this spec adds routes)\n\n## Done when\n- [x] All tasks checked\n- [x] Every Traceability row has a passing test or a manual step that a human ran after TestPlan\n- [x] Gates green\n","note":null},{"path":"decisions.md","bytes":2132,"kind":"markdown","view":null,"content":"# Decisions — spec-HIRE-4-company-reviews\n\nDecisions made while writing the spec. Each one names the alternative we turned down and why.\n\n## D1 — The rating summary goes in the reviews list meta, not on company show\n\n- **Decision**: `GET /api/v1/companies/{slug}/reviews` returns `meta.average_rating` next to the pagination meta. `GET /api/v1/companies/{slug}` gets no review fields.\n- **Alternative**: add `average_rating` and `review_count` to the Company payload.\n- **Why**: the company show payload is a published contract. `getCompany()` in `web/lib/api/jobs.ts` and the web `Company` type mirror it field for field, and MNC-1 freezes it. Clients that want the summary already call the reviews list, and its `meta.total` is the review count.\n- **Consequence**: a page that shows the rating makes one extra request. That is acceptable at Hireboard's size.\n\n## D2 — Moderation state is a status column on company_reviews\n\n- **Decision**: `status` (`pending | approved | rejected`) plus `moderated_by`, `moderated_at` and `rejection_reason` on `company_reviews`.\n- **Alternative**: a separate `review_moderations` table holding one row per decision.\n- **Why**: v1 has exactly one decision per review and no history (BR-44: moderation is final). A second table would add a join to every public read and buy nothing until edit or resubmit exists.\n- **Revisit when**: reviews become editable or resubmittable, because then a decision history is needed.\n\n## D3 — Unique index plus a service pre-check for one review per company\n\n- **Decision**: `UNIQUE (company_id, candidate_id)` in the migration, and `CompanyReviewService::submit()` checks `existsForCandidate()` first and throws `ReviewAlreadyExistsException` (409 `review_already_exists`).\n- **Alternative**: rely on the index alone and translate the database error.\n- **Why**: the pre-check gives the common case a clear domain error without touching the database error path. The index is still the guarantee. `CompanyReviewRepository::create()` also maps a `UniqueConstraintViolationException` to the same exception, so a double-click race answers 409 instead of 500.\n","note":null},{"path":"manual-test.md","bytes":5261,"kind":"markdown","view":null,"content":"# Manual test — spec-HIRE-4-company-reviews\n\nVerifies company reviews and moderation by hand. Every step lists the exact action and the exact\nexpected result. Steps 3 and 4 are the only proof for AC-11; the rest back up the Pest suite.\n\n## Preconditions\n\n1. Both repos on `feature/HIRE-4-company-reviews`.\n2. Fresh local data (local only, this wipes the database):\n   ```bash\n   cd ~/work/hireboard/api \u0026\u0026 php artisan migrate:fresh --seed\n   ```\n3. API running: `php artisan serve --port=8000` in `api/`.\n4. Web running: `npm run dev` in `web/`, with `API_BASE_URL=http://localhost:8000` in `web/.env.local`.\n5. Demo accounts (password `password`): `candidate@hireboard.test`, `employer@acme.test`, `admin@hireboard.test`.\n6. Use a private browser window so no earlier session cookie is present.\n\n### Step 1\n\nNo public reviews yet.\n\n```bash\ncurl -s http://localhost:8000/api/v1/companies/acme-robotics/reviews | jq '{data, meta}'\n```\nExpected: `\"data\": []`, `meta.total` is `0`, `meta.average_rating` is `null`.\n\n### Step 2\n\nGuests see a sign-in prompt.\n\nOpen http://localhost:3000/companies/acme-robotics/reviews.\nExpected: heading \"Reviews\", the text \"No published reviews yet.\" and a \"Sign in as a candidate\"\nlink to `/login?next=%2Fcompanies%2Facme-robotics%2Freviews`. No form.\n\n### Step 3\n\nA candidate submits a review (AC-11, AC-1).\n\n1. Sign in at http://localhost:3000/login as `candidate@hireboard.test` / `password`.\n2. Open http://localhost:3000/companies/acme-robotics/reviews.\n3. Expected: the form \"Review Acme Robotics\" with Rating (1-5), Title and Your review.\n4. Pick rating 4, title `Clear goals, kind team`, review\n   `Interviews were well organised and the feedback arrived within a week.` and press \"Submit review\".\n5. Expected: the form is replaced by \"Thanks - your review is awaiting moderation.\"\n\n### Step 4\n\nThe status card replaces the form (AC-11, AC-2).\n\nReload http://localhost:3000/companies/acme-robotics/reviews.\nExpected: a \"Your review\" card with \"Your review is awaiting moderation.\" and the title\n`Clear goals, kind team`. No form. The public list is still empty.\n\n### Step 5\n\nValidation messages (AC-4).\n\nSign in as a new candidate: register at http://localhost:3000/register with role Candidate,\nname `Riley Reviewer`, email `riley@hireboard.test`, password `password123`. Open\nhttp://localhost:3000/companies/northwind-health/reviews, enter title `Meh` and review `Too short.`, submit.\nExpected: \"Please fix the highlighted fields.\" plus a message under Title and under Your review.\nNothing is stored.\n\n### Step 6\n\nAn admin approves (AC-8, AC-7, AC-6).\n\n1. Sign out (account menu, \"Sign out\"), sign in as `admin@hireboard.test`.\n2. Open http://localhost:3000/admin/reviews.\n3. Expected: \"1 pending, oldest first.\" and the review by `Casey Candidate` for Acme Robotics.\n4. Press \"Approve\". Expected: the queue shows \"Nothing to moderate.\"\n5. Open http://localhost:3000/companies/acme-robotics/reviews.\n   Expected: the review is listed with \"Verified candidate\", the average shows `4.0` from 1 review,\n   and the name \"Casey Candidate\" appears nowhere on the page.\n\n### Step 7\n\nAn admin rejects; the candidate sees the reason (AC-9, AC-10).\n\n1. As `riley@hireboard.test`, submit a valid review for Northwind Health\n   (rating 2, title `Slow hiring process`, review `Three weeks between interviews and no feedback at all.`).\n2. As `admin@hireboard.test` on http://localhost:3000/admin/reviews, type the reason\n   `Please remove the recruiter's name.` and press \"Reject\".\n   Expected: the review leaves the queue.\n3. As `riley@hireboard.test`, open http://localhost:3000/companies/northwind-health/reviews.\n   Expected: \"Your review was not published.\" and \"Reason: Please remove the recruiter's name.\".\n   The public list is empty.\n4. Try to decide it again:\n   ```bash\n   TOKEN=$(curl -s -X POST http://localhost:8000/api/v1/auth/login -H 'Accept: application/json' \\\n     -H 'Content-Type: application/json' -d '{\"email\":\"admin@hireboard.test\",\"password\":\"password\"}' | jq -r .data.token)\n   ID=$(sqlite3 database/database.sqlite \"select id from company_reviews where status='rejected' limit 1\")\n   curl -s -X POST \"http://localhost:8000/api/v1/admin/reviews/$ID/approve\" \\\n     -H \"Authorization: Bearer $TOKEN\" -H 'Accept: application/json' | jq '{status, code}'\n   ```\n   Run from `api/`. Expected: `{\"status\": 409, \"code\": \"review_already_moderated\"}`.\n\n### Step 8\n\nCompany show payload unchanged (MNC-1).\n\n```bash\ncurl -s http://localhost:8000/api/v1/companies/acme-robotics | jq '.data | keys'\n```\nExpected exactly: `[\"description\", \"id\", \"location\", \"name\", \"open_jobs_count\", \"slug\", \"website\"]`.\n\n### Step 9\n\nJob search unchanged (MNC-2).\n\nOpen http://localhost:3000/jobs as a guest and filter by Remote.\nExpected: the same open postings, order and filters as before this branch; no review data on job cards.\n\n### Step 10\n\nEmployers and admins get no form (AC-3).\n\nSign in as `employer@acme.test` and open http://localhost:3000/companies/acme-robotics/reviews.\nExpected: the public list only. No form, no status card.\n\n## Rollback\n\nThe change adds one table and no data migration. To back it out locally:\n`php artisan migrate:rollback --step=1` in `api/` drops `company_reviews`; then revert the two branches.\n","note":null}],"updatedAt":"2026-10-22T09:40:00.000Z","updatedSource":"approved","etag":"18302a7ed313"},{"key":"api/spec-HIRE-5-candidate-profiles","id":"spec-HIRE-5-candidate-profiles","folder":"spec-HIRE-5-candidate-profiles","root":"r0","repo":"api","format":"frontmatter","folderPattern":"ticket","shortId":"HIRE-5","title":"Candidate profiles","type":"feature","size":"M","priority":"P1","status":"done","statusSource":"frontmatter","rawStatus":"done","ticket":"HIRE-5","stakeholders":["Maya Chen"],"approvedBy":"Maya Chen","approvedAt":"2026-10-23T08:30:00Z","created":"2026-10-23","stacks":["laravel","nextjs"],"frontmatter":{"id":"spec-HIRE-5-candidate-profiles","title":"Candidate profiles","type":"feature","size":"M","priority":"P1","status":"done","ticket":"HIRE-5","stakeholders":["Maya Chen"],"approved_by":"Maya Chen","approved_at":"2026-10-23T08:30:00Z","created":"2026-10-23","stacks":["laravel","nextjs"]},"body":"# Candidate profiles\n\n## Summary\nCandidates create and edit one private profile (headline, location, bio, skills, years of experience, open to work). The profile is the prerequisite for applying to jobs in HIRE-6 (BR-30), so it ships first. Only the owner reads or writes it.\n\n## Context\n- **Problem**: Candidates can register and sign in (HIRE-3), but there is nowhere to describe who they are, and HIRE-6 needs a profile headline to show employers.\n- **User impact**: Candidates get a profile page under their account. Employers later see name, email and headline through applications only (BR-21).\n\n## Scope\n### In scope\n- `candidate_profiles` table (schema doc first), model, factory.\n- `GET /api/v1/me/profile` and `PUT /api/v1/me/profile` (upsert), candidate-only.\n- Web: `/profile` page with `ProfileForm` and `saveProfileAction`.\n### Out of scope\n- Public or employer-facing profile pages, avatars, CV upload, profile search.\n- Showing the profile to employers (HIRE-6 exposes only name, email and headline).\n\n## Must NOT change\n- **MNC-1**: `GET /api/v1/auth/me` response shape (`{id, name, email, role}`) and role semantics are unchanged.\n- **MNC-2**: Public endpoints (`GET /api/v1/jobs`, `GET /api/v1/jobs/{id}`, `GET /api/v1/companies/{slug}`) stay tokenless with unchanged shapes.\n\n## Acceptance criteria\n- **AC-1**: WHEN an authenticated candidate without a profile requests `GET /api/v1/me/profile` THE SYSTEM SHALL respond 404 with code `profile_not_found`.\n- **AC-2**: WHEN an authenticated candidate sends a valid `PUT /api/v1/me/profile` THE SYSTEM SHALL create the profile if none exists or replace it otherwise, respond 200 with the CandidateProfile shape `{id, headline, location, bio, skills[], years_experience, open_to_work, updated_at}`, and a following GET SHALL return the same data.\n- **AC-3**: IF headline is not 3-120 chars, OR skills has more than 20 items, an item longer than 40 chars, or two items equal ignoring case, OR years_experience is not an integer 0-60 THEN THE SYSTEM SHALL respond 422 `validation_failed` with field errors and store nothing.\n- **AC-4**: IF the authenticated user is an employer or admin THEN THE SYSTEM SHALL respond 403 `forbidden` to both profile endpoints.\n- **AC-5**: WHEN a guest calls either profile endpoint THE SYSTEM SHALL respond 401 `unauthenticated`.\n- **AC-6**: WHEN a signed-in candidate opens `/profile` THE page SHALL pre-fill the form with the saved profile (empty form plus a \"You need a profile before you can apply\" note when there is none), and after a valid save SHALL show \"Profile saved\". Invalid input SHALL show the API's message next to the field.\n\n## Boundaries\n- **Always**: a Pest feature test per API AC; service-repository + DTOs (INV-02); schema doc before the migration; add the two routes to `api/docs/api/api-contracts.md` and `web/lib/api/endpoints.ts` (INV-06).\n- **Ask first**: any change to the `users` table or `User` model; a new dependency; exposing any profile field outside `/me/profile`.\n- **Never**: an endpoint that takes a profile id or user id; returning `user_id`; weakening existing tests; touching auth flows.\n\n## Technical context\n- **Related code**: `app/Http/Controllers/Auth/*` (HIRE-3 controller shape), `app/Policies/CompanyReviewPolicy.php` (HIRE-4 role policy), `app/DTOs/SubmitCompanyReviewDTO.php` (validated input DTO), `web/app/companies/[slug]/reviews/actions.ts` (422 to field-error mapping).\n- **Already implemented**: Sanctum auth, `UserRole`, `User::isCandidate()`, `requireUser()` and the `(account)` layout, middleware matcher `/profile/:path*` (all HIRE-3).\n- **Approach**: `ShowMyProfileController` / `UpsertMyProfileController` → `CandidateProfileService` → `CandidateProfileRepositoryInterface` (`findByUserId`, `upsertForUser`). `CandidateProfilePolicy::manage` gates by role. The profile is always resolved from the authenticated user.\n- **Repos**: backend `api/`, frontend `web/` (workspace `~/work/hireboard`).\n\n## Decisions\n1. `PUT` upsert instead of separate POST/PATCH: one form, one endpoint, idempotent. The first save creates the row.\n2. Skills are a JSON column, not a `skills` table: no search by skill in v1. Revisit when employers filter candidates.\n\n## Open questions\n- [x] Q1: Are \"PHP\" and \"php\" the same skill, and is a duplicate silently merged or rejected? — **Answered (Maya Chen)**: same skill. Values are trimmed and compared case-insensitively, and a duplicate is rejected with 422 on that item (`skills.N`). Folded into AC-3.\n- [x] Q2: Can an employer read a candidate's profile directly, e.g. from an application? — **Answered**: no. Per BR-21 there is no employer-facing profile endpoint. HIRE-6 shows name, email and headline inside the application only. Folded into Scope and Boundaries.\n\n## Dependencies\n- **Requires**: spec-HIRE-3-accounts-and-roles (done).\n- **Blocks**: spec-HIRE-6-job-applications (BR-30 `profile_required`).\n\n---\nNext: `/sdd spec-HIRE-5-candidate-profiles` (approval → build) or `/execute-task --spec=HIRE-5`\n","tasks":{"present":true,"counting":"numbered","total":4,"done":4,"subtotal":19,"subdone":19,"phases":["Phase 1: Backend (api/)","Phase 2: Frontend (web/)"],"items":[{"number":1,"title":"Schema doc, migration, model and factory for candidate_profiles","stack":"laravel","checked":true,"phase":"Phase 1: Backend (api/)","covers":[],"coversText":"scaffolding for AC-1..AC-5","subtasks":[{"number":"1.1","text":"Write `docs/schemas/candidate-profiles.md` first (schema-first)","checked":true,"verify":false},{"number":"1.2","text":"Migration `2026_10_23_090000_create_candidate_profiles_table` (uuid id, unique user_id FK cascade, json skills)","checked":true,"verify":false},{"number":"1.3","text":"`App\\Models\\CandidateProfile` (HasUuids, casts) and `CandidateProfileFactory`","checked":true,"verify":false},{"number":"1.4","text":"**Verify**: `php artisan migrate:fresh --seed` locally; gates green","checked":true,"verify":true}]},{"number":2,"title":"Show and upsert endpoints with policy and tests","stack":"laravel","checked":true,"phase":"Phase 1: Backend (api/)","covers":["AC-1","AC-2","AC-3","AC-4","AC-5","MNC-1","MNC-2"],"coversText":"AC-1, AC-2, AC-3, AC-4, AC-5, MNC-1, MNC-2","subtasks":[{"number":"2.1","text":"Failing Pest tests: `tests/Feature/Profiles/ShowMyProfileTest.php`, `UpsertMyProfileTest.php` (one per AC)","checked":true,"verify":false},{"number":"2.2","text":"DTOs `UpsertCandidateProfileDTO` (rules incl. `distinct:ignore_case`), `CandidateProfileDTO`","checked":true,"verify":false},{"number":"2.3","text":"`CandidateProfileRepositoryInterface` + repository, bound in `RepositoryServiceProvider`","checked":true,"verify":false},{"number":"2.4","text":"`CandidateProfileService`, `ProfileNotFoundException`, `CandidateProfilePolicy::manage`","checked":true,"verify":false},{"number":"2.5","text":"Controllers + `routes/api/v1/profiles.php`; add both routes to `docs/api/api-contracts.md`","checked":true,"verify":false},{"number":"2.6","text":"**Verify**: new tests green; `LoginTest` and `PublicEndpointsGuardTest` unchanged and green; gates green","checked":true,"verify":true}]},{"number":3,"title":"Types, fetchers and saveProfileAction","stack":"nextjs","checked":true,"phase":"Phase 2: Frontend (web/)","covers":["AC-6"],"coversText":"AC-6 (data layer)","subtasks":[{"number":"3.1","text":"`types/api/profiles.ts` mirrors the CandidateProfile shape exactly","checked":true,"verify":false},{"number":"3.2","text":"`showMyProfile` / `upsertMyProfile` in `lib/api/endpoints.ts`; `lib/api/profiles.ts` (`getMyProfile` returns null on `profile_not_found`)","checked":true,"verify":false},{"number":"3.3","text":"`app/(account)/profile/actions.ts` `saveProfileAction`: 422 `errors` (incl. `skills.N`) mapped to form fields; 401 → `/login?next=/profile`","checked":true,"verify":false},{"number":"3.4","text":"**Verify**: web gates green","checked":true,"verify":true}]},{"number":4,"title":"/profile page and ProfileForm","stack":"nextjs","checked":true,"phase":"Phase 2: Frontend (web/)","covers":["AC-6"],"coversText":"AC-6","subtasks":[{"number":"4.1","text":"`app/(account)/profile/page.tsx` with `requireUser(['candidate'])`, `dynamic = 'force-dynamic'`","checked":true,"verify":false},{"number":"4.2","text":"`components/profile-form.tsx` (`useActionState`, field errors, success banner)","checked":true,"verify":false},{"number":"4.3","text":"Account nav \"Profile\" link for candidates already points here (HIRE-3), no change","checked":true,"verify":false},{"number":"4.4","text":"**Manual check** (AC-6): as candidate@hireboard.test open `/profile` → empty form with the \"need a profile\" note → fill headline \"Backend developer\", skills \"PHP, Laravel\", years 4 → Save → \"Profile saved\" and the values stay → reload, values pre-filled → enter skills \"PHP, php\" → error under Skills, nothing saved. As employer@acme.test, `/profile` redirects away (requireUser)","checked":true,"verify":false},{"number":"4.5","text":"**Verify**: web gates green, `npm run build` (new route)","checked":true,"verify":true}]}],"extra":[],"traceability":[{"id":"AC-1","criterion":"404 profile_not_found before first save","verifiedBy":"`tests/Feature/Profiles/ShowMyProfileTest.php::returns 404 profile_not_found before the profile exists`","kind":"test","task":"2","taskNumbers":[2]},{"id":"AC-2","criterion":"PUT upserts, GET returns it","verifiedBy":"`tests/Feature/Profiles/UpsertMyProfileTest.php::creates the profile on first save`, `::updates the existing profile`, `tests/Feature/Profiles/ShowMyProfileTest.php::returns the candidate profile`","kind":"test","task":"2","taskNumbers":[2]},{"id":"AC-3","criterion":"422 on headline / skills / years","verifiedBy":"`tests/Feature/Profiles/UpsertMyProfileTest.php::validates headline, skills and years of experience`","kind":"test","task":"2","taskNumbers":[2]},{"id":"AC-4","criterion":"403 for employers and admins","verifiedBy":"`tests/Feature/Profiles/UpsertMyProfileTest.php::forbids employers`","kind":"test","task":"2","taskNumbers":[2]},{"id":"AC-5","criterion":"401 for guests","verifiedBy":"`tests/Feature/Profiles/UpsertMyProfileTest.php::requires authentication`","kind":"test","task":"2","taskNumbers":[2]},{"id":"AC-6","criterion":"/profile pre-fills, saves, shows errors","verifiedBy":"tasks.md step 4.4 (manual c ":"2026-10-23T15:52:00.000Z","updatedSource":"session","etag":"3c8793bfa335"},{"key":"api/spec-HIRE-6-job-applications","id":"spec-HIRE-6-job-applications","folder":"spec-HIRE-6-job-applications","root":"r0","repo":"api","format":"frontmatter","folderPattern":"ticket","shortId":"HIRE-6","title":"Job applications","type":"feature","size":"M","priority":"P1","status":"done","statusSource":"frontmatter","rawStatus":"done","ticket":"HIRE-6","stakeholders":["Maya Chen"],"approvedBy":"Maya Chen","approvedAt":"2026-10-24T09:05:00Z","created":"2026-10-24","stacks":["laravel","nextjs"],"frontmatter":{"id":"spec-HIRE-6-job-applications","title":"Job applications","type":"feature","size":"M","priority":"P1","status":"done","ticket":"HIRE-6","stakeholders":["Maya Chen"],"approved_by":"Maya Chen","approved_at":"2026-10-24T09:05:00Z","created":"2026-10-24","stacks":["laravel","nextjs"]},"body":"# Job applications\n\n## Summary\nCandidates apply to open job postings with an optional cover letter, and employers see who\napplied to their own company's jobs. This closes the loop the job board exists for: until now a\nvisitor could find a job but had no way to act on it.\n\n## Context\n- **Problem**: HIRE-6 (pasted into `/sdd`, no tracker connected): \"Candidates apply to open jobs\n  with an optional cover letter; employers see applicants for their own jobs\". The job detail\n  page already links \"Apply\" to `/jobs/[id]/apply`, which is a 404 today.\n- **User impact**: candidates can apply without leaving Hireboard; employers get one list of\n  applicants with the contact details they need. The data is personal (name, email, headline,\n  cover letter), so access rules matter as much as the happy path.\n- **Rules**: BR-21, BR-30, BR-31, BR-32 and BR-33 in `docs/context/business-rules.md`. They were\n  recorded and validated with the product brief, so this spec adds no new business rule.\n\n## Scope\n### In scope\n- `POST /api/v1/jobs/{id}/applications` for candidates with a profile.\n- `GET /api/v1/me/applications` (the candidate's own list) and\n  `GET /api/v1/employer/applications` (applications to the employer's company).\n- Web: `/jobs/[id]/apply` with `ApplyForm`, `/applications` for candidates,\n  `/employer/applications` for employers.\n### Out of scope\n- Withdrawing or editing an application (clarity gate Q2).\n- Application status workflow (shortlisted, rejected) and notifications or emails.\n- File uploads (CV attachments).\n- Employers publishing or closing postings (HIRE-11).\n\n## Must NOT change\n- **MNC-1**: The `GET /api/v1/jobs/{id}` response shape is unchanged (no application fields are added).\n- **MNC-2**: Guests can still view the job detail page `/jobs/[id]` without signing in.\n\n## Acceptance criteria\n- **AC-1**: WHEN a candidate with a profile submits an application to an open job, with an\n  optional `cover_letter` of at most 2000 characters, THE SYSTEM SHALL store it and respond 201\n  with the candidate's view of the application.\n- **AC-2**: IF the candidate has no profile THEN THE SYSTEM SHALL respond 422 with code\n  `profile_required` (BR-30).\n- **AC-3**: IF the job exists but is not open (draft or closed) THEN THE SYSTEM SHALL respond\n  422 with code `job_not_open` (BR-31).\n- **AC-4**: IF the candidate already applied to that job THEN THE SYSTEM SHALL respond 409 with\n  code `already_applied`, including when two submissions race each other (BR-32).\n- **AC-5**: IF the user is not a candidate THEN THE SYSTEM SHALL respond 403. IF the job id is\n  unknown THEN THE SYSTEM SHALL respond 404 with code `job_not_found`.\n- **AC-6**: WHEN a candidate requests `GET /api/v1/me/applications` THE SYSTEM SHALL return only\n  their own applications, newest first, paginated (`per_page` 1-50, default 20).\n- **AC-7**: WHEN an employer requests `GET /api/v1/employer/applications` THE SYSTEM SHALL return\n  only applications to postings of the company they own, including closed postings, each with\n  the candidate's name, email and headline and nothing else from the profile (BR-21, BR-33),\n  newest first, paginated (`per_page` 1-50, default 20).\n- **AC-8**: WHEN a signed-in candidate submits `ApplyForm` on `/jobs/[id]/apply` THE page SHALL\n  redirect to `/applications` with the banner \"Application sent. The employer can now see it.\"\n  WHEN the API answers `profile_required` THE form SHALL show a banner linking to `/profile`\n  (manual-test.md#step-2, #step-3).\n\n## Boundaries\n- **Always**: a Pest feature test per API acceptance criterion; invokable controller, service,\n  DTOs and a repository behind `App\\Contracts`; register the new endpoints in\n  `docs/api/api-contracts.md` and `web/lib/api/endpoints.ts`; schema doc before the migration.\n- **Ask first**: any change to `users`, `companies`, `job_postings` or `candidate_profiles`;\n  a new dependency; any change to the job show payload.\n- **Never**: return candidate data from a public endpoint; let an employer read another\n  company's applications; expose profile fields beyond name, email and headline; weaken or\n  delete existing tests; touch the auth flow.\n\n## Technical context\n- **Related code**: `app/Services/JobPostingService.php` and\n  `app/Contracts/JobPostingRepositoryInterface.php` (`findById()` finds a posting in any status,\n  which the apply flow needs to tell 404 from `job_not_open`), `app/Models/CandidateProfile.php`\n  (HIRE-5), `app/Policies/CandidateProfilePolicy.php` (policy pattern),\n  `web/app/jobs/[id]/page.tsx` (the existing Apply link), `web/middleware.ts` (its matcher\n  already lists `/applications/:path*`, `/employer/:path*` and `/jobs/:id/apply`).\n- **Already implemented**: the middleware matcher entries above and the account layout's\n  \"Applications\" nav links for candidates and employers (HIRE-3). Do not rebuild them.\n- **Approach**: one `job_applications` table with a unique `(job_posting_id, candidate_id)`\n  index. `JobApplicationService::submit()` checks found, open, profile and duplicate, in that\n  order. The employer list is scoped in the query by `companies.owner_id`, not filtered after\n  fetching. `JobApplicationDTO` has two outputs: `toApiArray()` for the candidate and\n  `toEmployerArray()` for the employer.\n- **Repos**: backend `api/`, frontend `web/` (workspace `~/work/hireboard`).\n\n## Open questions\n- [x] Q1: Does the employer list include applications to closed postings? — **Answered**: yes,\n  closed postings stay visible to the owning employer (BR-33).\n- [x] Q2: Can a candidate withdraw or edit an application? — **Accepted assumption**: no, out of\n  scope for v1. One application per posting stays final (BR-32).\n- [x] Q3: Does the employer see the candidate's email, or only the name? — **Answered**: name,\n  email and headline, and nothing else from the profile (BR-21).\n\n## Dependencies\n- **Requires**: HIRE-3 (accounts and roles), HIRE-5 (candidate profiles).\n- **Blocks**: HIRE-11 (employers publish and close postings).\n\n---\nNext: `/sdd spec-HIRE-6-job-applications` (approval → build) or `/execute-task --spec=HIRE-6`\n","tasks":{"present":true,"counting":"numbered","total":5,"done":5,"subtotal":15,"subdone":15,"phases":["Phase 1: Backend","Phase 2: Frontend"],"items":[{"number":1,"title":"Schema doc, migration, model and factory for job_applications","stack":"laravel","checked":true,"phase":"Phase 1: Backend","covers":[],"coversText":"scaffolding for AC-1..AC-7","subtasks":[{"number":"1.1","text":"Write `docs/schemas/job-applications.md` first: columns, the unique `(job_posting_id, candidate_id)` index, relations, personal data note","checked":true,"verify":false},{"number":"1.2","text":"Migration, `JobApplication` model (`HasUuids`, `jobPosting`, `candidate`, `candidateProfile`), factory","checked":true,"verify":false},{"number":"1.3","text":"**Verify**: `php artisan migrate:fresh --seed` runs; gates green","checked":true,"verify":true}]},{"number":2,"title":"Submit endpoint with the application rules","stack":"l | `manual-test.md#step-2`, `manual-test.md#step-3` | manual | 4, 5 |\n| MNC-1 | job show payload unchanged | `tests/Feature/Jobs/ShowJobPostingTest.php::shows an open posting with its company` (unchanged) | test | 2 |\n| MNC-2 | guests still see job detail | `manual-test.md#step-1` | manual | 4 |\n\n## Verification gates\n\n- backend (laravel, run in `api/`): `./vendor/bin/pint --test`, `./vendor/bin/phpstan analyse --no-progress`, `php artisan test`\n- frontend (nextjs, run in `web/`): `npm run lint`, `npx tsc --noEmit`, `npm test`, plus `npm run build` because this spec adds routes\n\n## Done when\n- [x] All tasks checked\n- [x] Every Traceability row has a passing test or a manual step that was run\n- [x] Gates green\n","note":null},{"path":"manual-test.md","bytes":3400,"kind":"markdown","view":null,"content":"# Manual test plan: job applications (HIRE-6)\n\nSpec: `spec-HIRE-6-job-applications`. Run against a freshly seeded local database. Steps 1-5\ntake about ten minutes.\n\n## Preconditions\n\n```bash\n# terminal 1\ncd ~/work/hireboard/api \u0026\u0026 php artisan migrate:fresh --seed \u0026\u0026 php artisan serve --port=8000\n# terminal 2\ncd ~/work/hireboard/web \u0026\u0026 npm run dev\n```\n\nGet the id of an open Acme Robotics posting and keep it as `JOB_ID`:\n\n```bash\ncurl -s 'http://localhost:8000/api/v1/jobs?company=acme-robotics' | jq -r '.data[0].id'\n```\n\nAccounts (password `password`): `employer@acme.test` (owns Acme Robotics). Step 2 creates a new\ncandidate so the run never depends on whether a seeded candidate already has a profile.\n\nUse a private browser window so no earlier session cookie is present.\n\n## Step 1 — Guests can still read the job, applying asks them to sign in (MNC-2)\n\n1. Open `http://localhost:3000/jobs/JOB_ID` without signing in.\n   **Expected**: the job detail renders with the company name and an **Apply** link. No redirect.\n2. Click **Apply**.\n   **Expected**: redirect to `/login?next=%2Fjobs%2FJOB_ID%2Fapply`.\n\n## Step 2 — A candidate without a profile is sent to create one (AC-2, AC-8)\n\n1. Open `http://localhost:3000/register`. Select **Looking for a job** and register with name `Pat Applicant`,\n   email `pat.applicant@example.test`, password `password123`.\n   **Expected**: you are signed in and land on `/dashboard`.\n2. Open `http://localhost:3000/jobs/JOB_ID/apply`, leave the cover letter empty and click\n   **Send application**.\n   **Expected**: the page stays on the form and shows \"Create your candidate profile before you\n   apply.\" with a **Go to your profile** link to `/profile`. Nothing is listed on `/applications`.\n\n## Step 3 — With a profile, the application goes through (AC-1, AC-8)\n\n1. Click **Go to your profile**. Enter the headline `Embedded C++ engineer`, fill the other\n   required fields with any valid values, and save.\n   **Expected**: \"Profile saved\".\n2. Open `http://localhost:3000/jobs/JOB_ID/apply`, enter the cover letter\n   `I built ROS 2 drivers for warehouse robots for three years.` and click **Send application**.\n   **Expected**: redirect to `/applications?applied=1` with the green banner \"Application sent.\n   The employer can now see it.\" The posting is listed first with today's date and links to the\n   job and to `/companies/acme-robotics`.\n\n## Step 4 — A second application to the same job is refused (AC-4)\n\n1. Open `http://localhost:3000/jobs/JOB_ID/apply` again and click **Send application**.\n   **Expected**: \"You have already applied to this job.\" and still exactly one entry on\n   `/applications`.\n\n## Step 5 — The employer sees the applicant, and only their own applicants (AC-7)\n\n1. Click **Sign out** in the account navigation. Sign in as `employer@acme.test`.\n2. Open `http://localhost:3000/employer/applications`.\n   **Expected**: Pat Applicant is listed with the headline \"Embedded C++ engineer\", a\n   `mailto:pat.applicant@example.test` link, the cover letter and the job title. No skills, bio or\n   years of experience are shown. Applications to Northwind Health or Blue Fern Studio postings\n   never appear here.\n\n## Rollback\n\nThe change is additive: one new table and three new endpoints. To roll back locally, revert the\nmerge commits in `web` and then `api`, and run `php artisan migrate:rollback --step=1` in `api/`.\n","note":null}],"updatedAt":"2026-10-24T09:05:00.000Z","updatedSource":"approved","etag":"939e7ac24cec"},{"key":"web/spec-HIRE-7-company-careers-page","id":"spec-HIRE-7-company-careers-page","folder":"spec-HIRE-7-company-careers-page","root":"r1","repo":"web","format":"frontmatter","folderPattern":"ticket","shortId":"HIRE-7","title":"Company careers page","type":"feature","size":"S","priority":"P2","status":"done","statusSource":"frontmatter","rawStatus":"done","ticket":"HIRE-7","stakeholders":["Maya Chen"],"approvedBy":"Maya Chen","approvedAt":"2026-10-28T10:15:00Z","created":"2026-10-28","stacks":["nextjs"],"frontmatter":{"id":"spec-HIRE-7-company-careers-page","title":"Company careers page","type":"feature","size":"S","priority":"P2","status":"done","ticket":"HIRE-7","stakeholders":["Maya Chen"],"approved_by":"Maya Chen","approved_at":"2026-10-28T10:15:00Z","created":"2026-10-28","stacks":["nextjs"]},"body":"# Company careers page\n\n## Summary\nVisitors get a public careers page per company at `/companies/\u003cslug\u003e`. It shows the company\nprofile, its open jobs and its rating, and job detail links the company name to it. Candidates\ncan size up an employer in one place before applying. Everything the page needs is already served\nby the API, so this is a web-only change.\n\n## Context\n- **Problem**: job detail shows the company name, but there is nowhere to see the company itself\n  or its other openings. Company reviews (HIRE-4) live on `/companies/\u003cslug\u003e/reviews`, which\n  nothing links to from the browse journey.\n- **User impact**: visitors and candidates compare employers without leaving Hireboard.\n\n## Scope\n### In scope\n- New page `app/companies/[slug]/page.tsx`, with no `loading.tsx` for the segment (see AC-2).\n- Rating summary (average + approved review count) with a link to `/companies/\u003cslug\u003e/reviews`.\n- Company name on job detail links to the careers page.\n### Out of scope\n- Any change in `api/` (new endpoints, new fields, eager-loaded counts).\n- Editing company details (employer self-service is a later ticket).\n- Pagination of the company's jobs beyond the first page; a \"See all\" link to\n  `/jobs?company=\u003cslug\u003e` covers larger companies.\n\n## Must NOT change\n- **MNC-1**: No change in `api/`. `git -C api diff --stat main` is empty after the build.\n- **MNC-2**: The `/jobs` page (filters, results, ordering, empty state) is unchanged.\n\n## Acceptance criteria\n- **AC-1**: WHEN anyone opens `/companies/\u003cslug\u003e` for an existing company THE SYSTEM SHALL show\n  its name, location, website and description, and list its open jobs from\n  `GET /api/v1/jobs?company=\u003cslug\u003e`.\n- **AC-2**: IF the slug does not match a company THEN THE SYSTEM SHALL render the app's not-found page\n  with `noindex` meta and an HTTP 404 status. The page awaits `getCompany()` and calls\n  `notFound()` before anything streams, so the route has no `loading.tsx`.\n- **AC-3**: WHEN the careers page renders THE SYSTEM SHALL show the average rating and the number\n  of approved reviews from the `listCompanyReviews` meta, or \"No reviews yet\" when there are none,\n  with a link to `/companies/\u003cslug\u003e/reviews`. Job detail SHALL link the company name to\n  `/companies/\u003cslug\u003e`.\n\n## Boundaries\n- **Always**: Server Components; all calls through `lib/api/*` fetchers and `lib/api/client.ts`;\n  `cache: 'no-store'`; Tailwind utility classes; reuse `JobCard`.\n- **Ask first**: any change in `api/`; a new dependency; a new endpoint in `lib/api/endpoints.ts`.\n- **Never**: call the API from the browser; change the `/jobs` page or `JobFilters`; weaken an\n  existing test.\n\n## Technical context\n- **Related code**: `lib/api/jobs.ts` (`getCompany`, `searchJobs`), `lib/api/reviews.ts`\n  (`listCompanyReviews`), `components/job-card.tsx`, `app/jobs/[id]/page.tsx`.\n- **Already implemented**:\n  - `GET /api/v1/companies/{slug}` returns `Company` with `open_jobs_count` (HIRE-1).\n  - `GET /api/v1/jobs?company=\u003cslug\u003e` filters open postings by company (HIRE-1).\n  - `GET /api/v1/companies/{slug}/reviews` returns `meta.average_rating` and `meta.total` (HIRE-4).\n  - `showCompany`, `searchJobs` and `listCompanyReviews` are already in `lib/api/endpoints.ts`.\n- **Approach**: one Server Component that loads the three calls in parallel with `Promise.all`,\n  calls `notFound()` when `getCompany` returns null, and treats a 404 from the reviews call as\n  \"no summary\" so an unknown slug still reaches `notFound()`.\n- **Repos**: `web/` changes; `../api` is read-only context.\n\n## Open questions\n- [x] Q1: What does the rating summary show for a company with no approved reviews? —\n  **Answered** (Maya Chen): the text \"No reviews yet\", still linking to the reviews page so the\n  first candidate can write one.\n\n## Dependencies\n- **Requires**: spec-HIRE-4-company-reviews (reviews list meta), HIRE-1 job search filters.\n- **Blocks**: none.\n\n---\nNext: `/sdd web/.ai/specs/spec-HIRE-7-company-careers-page` (approval → build)\n","tasks":{"present":true,"counting":"numbered","total":2,"done":2,"subtotal":8,"subdone":8,"phases":["Phase 1: Frontend"],"items":[{"number":1,"title":"Careers page","stack":"nextjs","checked":true,"phase":"Phase 1: Frontend","covers":["AC-1","AC-2"],"coversText":"AC-1, AC-2","subtasks":[{"number":"1.1","text":"`app/companies/[slug]/page.tsx`: load `getCompany(slug)` and `searchJobs({ company: slug })` in parallel; `notFound()` when the company is null","checked":true,"verify":false},{"number":"1.2","text":"Profile header (name, location, website, description) and the open jobs list with `JobCard`; \"See all N jobs\" link to `/jobs?company=\u003cslug\u003e` when there are more than one page","checked":true,"verify":false},{"number":"1.3","text":"No `loading.tsx` in `app/companies/[slug]/`: a loading boundary streams a 200 response before `notFound()` runs, which would break AC-2","checked":true,"verify":false},{"number":"1.4","text":"**Verify**: `/companies/acme-robotics` renders; `/companies/no-such-company` shows the not-found page with status 404; gates green","checked":true,"verify":true}]},{"number":2,"title":"Rating summary and job-detail company link","stack":"nextjs","checked":true,"phase":"Phase 1: Frontend","covers":["AC-3","MNC-2"],"coversText":"AC-3, MNC-2","subtasks":[{"number":"2.1","text":"Add `listCompanyReviews(slug, 1)` to the parallel load; a 404 from it yields no summary instead of an error","checked":true,"verify":false},{"number":"2.2","text":"Show `average_rating` to one decimal and the approved review count, or \"No reviews yet\"; link to `/companies/\u003cslug\u003e/reviews`","checked":true,"verify":false},{"number":"2.3","text":"Link the company name in `app/jobs/[id]/page.tsx` to `/companies/\u003cslug\u003e`","checked":true,"verify":false},{"number":"2.4","text":"**Verify**: summary matches `curl -s localhost:8000/api/v1/companies/acme-robotics/reviews | jq .meta`; `/jobs` unchanged; gates green; `npm run build` passes (new route)","checked":true,"verify":true}]}],"extra":[],"traceability":[{"id":"AC-1","criterion":"careers page shows profile + open jobs","verifiedBy":"`manual-test.md#step-1`, `npx tsc --noEmit`","kind":"manual","task":"1","taskNumbers":[1]},{"id":"AC-2","criterion":"unknown slug renders not-found (404)","verifiedBy":"`manual-test.md#step-2`","kind":"manual","task":"1","taskNumbers":[1]},{"id":"AC-3","criterion":"rating summary, \"No reviews yet\", reviews link, job-detail link","verifiedBy":"`manual-test.md#step-3`, `manual-test.md#step-4`, `manual-test.md#step-5`","kind":"manual","task":"2","taskNumbers"
