<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD Kit guide has moved</title>
<script>
var ALIASES = {
  '#route': '#which-route',
  '#workflows': '#workflows-direct',
  '#troubleshooting': '#help'
};

// Old field-guide hashes: example chapters were ex-NN, a few sections were renamed.
function map(hash) {
  var chapter = /^#ex-(\d+)$/.exec(hash);
  if (chapter) return '#example/' + chapter[1];
  return ALIASES[hash] || hash;
}
var target = 'index.html' + map(location.hash);
location.replace(target);
document.addEventListener('DOMContentLoaded', function () {
  var link = document.querySelector('a[href^="index.html"]');
  if (link) link.href = target;
});
</script>
</head>
<body>
<p>The guide moved. Open <a href="index.html">index.html</a>.</p>
</body>
</html>
