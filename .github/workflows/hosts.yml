name: Claude Code and Codex compatibility
on:
  push:
    paths: ['adapters/**', 'scripts/**', 'tests/**', 'cli/**', 'plugins/**', 'share/**', 'package*.json', 'docs/**', 'README.md', '.claude-plugin/**', '.github/workflows/hosts.yml']
  pull_request:
    paths: ['adapters/**', 'scripts/**', 'tests/**', 'cli/**', 'plugins/**', 'share/**', 'package*.json', 'docs/**', 'README.md', '.claude-plugin/**', '.github/workflows/hosts.yml']
permissions:
  contents: read
jobs:
  shared-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm test
